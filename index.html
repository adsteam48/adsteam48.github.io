<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord メッセージのみ復元ツール</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background:#202225; color:#dcddde; font-family:'Whitney',sans-serif; padding:20px; margin:0; }
        .container { max-width:900px; margin:0 auto; }
        header { text-align:center; padding:20px; border-bottom:1px solid #36393f; }
        h1, h2 { color:white; }
        .card { background:#2f3136; border-radius:8px; padding:20px; margin:20px 0; }
        .section { background:#36393f; border-radius:8px; padding:15px; margin-bottom:20px; }
        .section-title { font-size:1.2em; font-weight:bold; margin-bottom:10px; color:#5865F2; }
        input, select { width:100%; padding:12px; background:#202225; border:none; color:white; border-radius:4px; margin-bottom:10px; }
        button { padding:12px 20px; background:#5865F2; color:white; border:none; cursor:pointer; border-radius:4px; width:100%; font-size:1.1em; margin-top:10px; }
        button:hover { background:#4752C4; }
        button.danger { background:#ed4245; }
        .result { padding:15px; border-radius:8px; margin-top:20px; max-height:650px; overflow-y:auto; background:#1e1f22; white-space:pre-line; font-size:0.9em; line-height:1.5; }
        .hidden { display:none; }
        .warning { color:#faa81a; font-size:0.95em; margin:10px 0; line-height:1.5; }
        .log-success { color:#3ba55d; }
        .log-error { color:#ed4245; }
        .log-info { color:#faa81a; }
        .preview { background:#1e1f22; padding:15px; border-radius:8px; margin-top:10px; font-size:0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-discord"></i> Discord メッセージのみ復元ツール</h1>
            <p>プライベートチャンネル含む過去メッセージを復元 • 自己責任使用</p>
        </header>

        <div id="token-card" class="card">
            <h2>トークンを入力</h2>
            <input type="password" id="token-input" placeholder="ユーザー・トークン（mfa.も可）">
            <button id="connect-btn">接続</button>
        </div>

        <div id="main-card" class="card hidden">
            <h2>メッセージ復元設定</h2>

            <div class="section">
                <div class="section-title">コピー元サーバーID</div>
                <input type="text" id="source-id" placeholder="メッセージを復元したい元サーバーのID">
                <button id="load-btn">チャンネル一覧を取得</button>
                <div id="preview" class="preview hidden"></div>
            </div>

            <div class="section">
                <div class="section-title">対象サーバー</div>
                <select id="target-select"></select>
            </div>

            <div class="section">
                <div class="toggle-label">
                    <span>復元するメッセージの最大数（1チャンネルあたり）</span>
                    <input type="number" id="max-messages" value="500" style="width:120px; margin-left:10px;">
                </div>
                <div class="warning">
                    ⚠️ 注意<br>
                    ・復元は非常に時間がかかります（1チャンネル500件で約10〜20分程度）<br>
                    ・プライベートチャンネルも、あなたが見られる範囲で復元されます<br>
                    ・添付ファイルは一部しか復元できません
                </div>
            </div>

            <div class="section">
                <button id="execute-btn">メッセージ復元開始</button>
            </div>

            <div id="result" class="result hidden"></div>
        </div>

        <div id="user-card" class="card hidden">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <img id="avatar" src="" width="64" height="64" style="border-radius:50%;">
                <h3 id="username">接続済み</h3>
                <button id="logout-btn" class="danger">ログアウト</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://discord.com/api/v9';
        let token = null;
        let myGuilds = [];
        let sourceChannels = [];

        const delay = ms => new Promise(r => setTimeout(r, ms));

        // すべてのメッセージを取得（古い順）
        async function getAllMessages(channelId, limit = 100) {
            let messages = [];
            let lastId = null;
            let count = 0;

            while (true) {
                let url = `${API}/channels/${channelId}/messages?limit=${limit}`;
                if (lastId) url += `&before=${lastId}`;

                try {
                    const res = await fetch(url, { headers: { 'Authorization': token } });
                    if (!res.ok) break;
                    const batch = await res.json();
                    if (batch.length === 0) break;

                    messages.unshift(...batch); // 古い順に並べる
                    lastId = batch[0].id;
                    count += batch.length;

                    if (batch.length < limit) break;
                    await delay(550);
                } catch (e) {
                    break;
                }
            }
            return messages;
        }

        // Webhookを使ってメッセージを復元
        async function restoreChannelMessages(targetChannelId, messages, result, channelName) {
            if (messages.length === 0) {
                result.innerHTML += `<span class="log-info">メッセージなし: ${channelName}</span><br>`;
                return;
            }

            // Webhook作成
            let webhook = null;
            try {
                const wh = await fetch(`${API}/channels/${targetChannelId}/webhooks`, {
                    method: 'POST',
                    headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: "Restore Bot" })
                });
                if (wh.ok) webhook = await wh.json();
            } catch {}

            if (!webhook) {
                result.innerHTML += `<span class="log-error">Webhook作成失敗: ${channelName}</span><br>`;
                return;
            }

            result.innerHTML += `<span class="log-info">復元開始 → ${channelName} (${messages.length}件)</span><br>`;

            for (const msg of messages) {
                if (!msg.content && (!msg.embeds || msg.embeds.length === 0)) continue;

                try {
                    const payload = {
                        content: msg.content || "",
                        username: msg.author.global_name || msg.author.username,
                        avatar_url: msg.author.avatar 
                            ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png`
                            : null,
                        embeds: msg.embeds || [],
                        allowed_mentions: { parse: [] }
                    };

                    await fetch(`https://discord.com/api/webhooks/${webhook.id}/${webhook.token}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    result.innerHTML += `<span class="log-success">✓ ${msg.author.username}: ${msg.content ? msg.content.substring(0, 60) : "(埋め込み)"}</span><br>`;
                } catch (e) {
                    result.innerHTML += `<span class="log-error">✗ 失敗: ${msg.id}</span><br>`;
                }

                await delay(1350); // レートリミット対策（調整可能）
            }

            // Webhook削除
            try {
                await fetch(`${API}/webhooks/${webhook.id}`, { method: 'DELETE', headers: { 'Authorization': token } });
            } catch {}
        }

        // 接続
        document.getElementById('connect-btn').onclick = async () => {
            token = document.getElementById('token-input').value.trim();
            if (!token) return alert('トークンを入力してください');

            localStorage.setItem('discord_token', token);

            try {
                const me = await (await fetch(`${API}/users/@me`, { headers: { 'Authorization': token } })).json();
                document.getElementById('username').textContent = me.global_name || me.username;
                document.getElementById('avatar').src = me.avatar 
                    ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=128` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';

                myGuilds = await (await fetch(`${API}/users/@me/guilds`, { headers: { 'Authorization': token } })).json();

                const select = document.getElementById('target-select');
                select.innerHTML = myGuilds.map(g => `<option value="${g.id}">${g.name}</option>`).join('');

                document.getElementById('token-card').classList.add('hidden');
                document.getElementById('main-card').classList.remove('hidden');
                document.getElementById('user-card').classList.remove('hidden');
            } catch (e) {
                alert('接続失敗: ' + (e.message || 'トークンが無効です'));
            }
        };

        // 元サーバーのチャンネル一覧取得
        document.getElementById('load-btn').onclick = async () => {
            const sourceId = document.getElementById('source-id').value.trim();
            if (!sourceId) return alert('元サーバーIDを入力してください');

            try {
                const channels = await (await fetch(`${API}/guilds/${sourceId}/channels`, {
                    headers: { 'Authorization': token }
                })).json();

                sourceChannels = channels.filter(ch => ch.type === 0); // テキストチャンネルのみ

                const preview = document.getElementById('preview');
                preview.classList.remove('hidden');
                preview.innerHTML = `
                    <strong>取得完了</strong><br>
                    テキストチャンネル数: ${sourceChannels.length}個<br>
                    <small>復元対象: ${sourceChannels.map(c => c.name).join(', ')}</small>
                `;
                alert(`テキストチャンネル ${sourceChannels.length}個 を取得しました`);
            } catch (e) {
                alert('チャンネル取得失敗: サーバーIDが正しいか、権限を確認してください');
            }
        };

        // 実行
        document.getElementById('execute-btn').onclick = async () => {
            const targetId = document.getElementById('target-select').value;
            const maxMsg = parseInt(document.getElementById('max-messages').value) || 300;

            if (!targetId) return alert('対象サーバーを選択してください');
            if (sourceChannels.length === 0) return alert('先に「チャンネル一覧を取得」ボタンを押してください');

            if (!confirm(`本当にメッセージを復元しますか？\n対象サーバー: ${document.getElementById('target-select').options[document.getElementById('target-select').selectedIndex].text}\n最大 ${maxMsg}件/チャンネル`)) return;

            const result = document.getElementById('result');
            result.classList.remove('hidden');
            result.innerHTML = '<strong>【メッセージ復元開始】</strong><br><br>';

            // 対象サーバーのチャンネル一覧を取得（名前でマッチング）
            let targetChannels = [];
            try {
                targetChannels = await (await fetch(`${API}/guilds/${targetId}/channels`, {
                    headers: { 'Authorization': token }
                })).json();
            } catch (e) {
                result.innerHTML += '<span class="log-error">対象サーバーのチャンネル取得に失敗</span><br>';
                return;
            }

            for (const srcCh of sourceChannels) {
                // 名前が同じチャンネルを探す
                const targetCh = targetChannels.find(tc => tc.type === 0 && tc.name === srcCh.name);

                if (!targetCh) {
                    result.innerHTML += `<span class="log-error">対象に同名チャンネルなし: #${srcCh.name}</span><br>`;
                    continue;
                }

                result.innerHTML += `<span class="log-info">処理中 → #${srcCh.name}</span><br>`;

                try {
                    const messages = await getAllMessages(srcCh.id, 100);
                    const limitedMessages = messages.slice(-maxMsg); // 最新のmaxMsg件を取得（古い順に並んでいるので末尾が最新）

                    await restoreChannelMessages(targetCh.id, limitedMessages, result, srcCh.name);
                } catch (e) {
                    result.innerHTML += `<span class="log-error">エラー: #${srcCh.name}</span><br>`;
                }

                await delay(1000);
            }

            result.innerHTML += '<br><strong style="color:#3ba55d">すべての復元処理が完了しました！</strong>';
        };

        document.getElementById('logout-btn').onclick = () => {
            if (confirm('ログアウトしますか？')) {
                localStorage.clear();
                location.reload();
            }
        };

        // 自動ログイン
        const savedToken = localStorage.getItem('discord_token');
        if (savedToken) {
            document.getElementById('token-input').value = savedToken;
            document.getElementById('connect-btn').click();
        }
    </script>
</body>
</html>
