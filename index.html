<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord チャンネル完全クローン - 安定版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background:#202225; color:#dcddde; font-family:'Whitney',sans-serif; padding:20px; margin:0; }
        .container { max-width:1000px; margin:0 auto; }
        header { text-align:center; padding:25px; border-bottom:1px solid #36393f; }
        h1 { color:white; margin:0; }
        .card { background:#2f3136; border-radius:8px; padding:20px; margin:20px 0; }
        .section { background:#36393f; border-radius:8px; padding:18px; margin-bottom:20px; }
        .section-title { font-size:1.25em; font-weight:bold; margin-bottom:12px; color:#5865F2; }
        input { width:100%; padding:12px; background:#202225; border:none; color:white; border-radius:4px; margin-bottom:10px; }
        button { padding:14px 20px; background:#5865F2; color:white; border:none; cursor:pointer; border-radius:4px; width:100%; font-size:1.1em; margin-top:10px; }
        button:hover { background:#4752C4; }
        button.danger { background:#ed4245; }
        .result { padding:18px; border-radius:8px; margin-top:20px; max-height:750px; overflow-y:auto; background:#1e1f22; white-space:pre-line; font-size:0.9em; line-height:1.55; }
        .hidden { display:none; }
        .warning { color:#faa81a; font-size:0.95em; margin:12px 0; line-height:1.6; }
        .log-success { color:#3ba55d; }
        .log-error { color:#ed4245; }
        .log-info { color:#faa81a; }
        .preview { background:#1e1f22; padding:15px; border-radius:8px; margin-top:10px; }
        .toggle-label { display:flex; align-items:center; justify-content:space-between; font-weight:bold; }
        .toggle-switch { position:relative; display:inline-block; width:60px; height:34px; }
        .toggle-switch input { opacity:0; width:0; height:0; }
        .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.4s; border-radius:34px; }
        .slider:before { position:absolute; content:""; height:26px; width:26px; left:4px; bottom:4px; background:white; transition:.4s; border-radius:50%; }
        input:checked + .slider { background:#5865F2; }
        input:checked + .slider:before { transform:translateX(26px); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-discord"></i> Discord チャンネル完全クローン - 安定版</h1>
            <p>カテゴリ＋チャンネル作成 + 自動メッセージ復元 • 停止対策強化</p>
        </header>

        <div id="token-card" class="card">
            <h2>トークンを入力</h2>
            <input type="password" id="token-input" placeholder="ユーザー・トークン">
            <button id="connect-btn">接続</button>
        </div>

        <div id="main-card" class="card hidden">
            <h2>設定</h2>

            <div class="section">
                <div class="section-title">コピー元サーバーID</div>
                <input type="text" id="source-id" placeholder="元のサーバーID">
                <button id="load-btn">チャンネル情報を取得</button>
                <div id="preview" class="preview hidden"></div>
            </div>

            <div class="section">
                <div class="section-title">対象サーバーID</div>
                <input type="text" id="target-id" placeholder="複製先のサーバーID">
            </div>

            <div class="section">
                <div class="toggle-label">
                    <span>実行前に対象サーバーの全チャンネルをリセット</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="reset-mode" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="warning">
                    ⚠️ リセットをONにすると対象サーバーの全チャンネルが削除されます
                </div>
            </div>

            <div class="section">
                <div class="toggle-label">
                    <span>1チャンネルあたりの復元メッセージ数</span>
                    <input type="number" id="max-messages" value="200" style="width:140px; margin-left:15px; background:#202225; color:white; padding:8px; border-radius:4px;">
                </div>
            </div>

            <div class="section">
                <button id="execute-btn" class="danger">完全クローン実行（チャンネル作成＋メッセージ復元）</button>
            </div>

            <div id="result" class="result hidden"></div>
        </div>

        <div id="user-card" class="card hidden">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <img id="avatar" src="" width="64" height="64" style="border-radius:50%;">
                <h3 id="username">接続済みユーザー</h3>
                <button id="logout-btn" class="danger">ログアウト</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://discord.com/api/v9';
        let token = null;
        let sourceChannels = [];

        const delay = ms => new Promise(r => setTimeout(r, ms));

        // 安定した遅延（エラー時は長めに待機）
        async function safeDelay(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        async function getAllMessages(channelId, limit = 100) {
            let messages = [];
            let lastId = null;
            for (let i = 0; i < 15; i++) {  // 最大15回ループ（安全策）
                try {
                    let url = `${API}/channels/${channelId}/messages?limit=${limit}`;
                    if (lastId) url += `&before=${lastId}`;
                    const res = await fetch(url, { headers: { 'Authorization': token } });
                    if (!res.ok) break;
                    const batch = await res.json();
                    if (batch.length === 0) break;
                    messages.unshift(...batch);
                    lastId = batch[0].id;
                    if (batch.length < limit) break;
                    await safeDelay(700);
                } catch (e) {
                    await safeDelay(1500);
                    break;
                }
            }
            return messages;
        }

        async function sendMessages(targetChannelId, messages, result, channelName) {
            if (messages.length === 0) return;

            let webhook = null;
            try {
                const whRes = await fetch(`${API}/channels/${targetChannelId}/webhooks`, {
                    method: 'POST',
                    headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: "Clone Restore" })
                });
                if (whRes.ok) webhook = await whRes.json();
            } catch (e) {
                result.innerHTML += `<span class="log-error">Webhook作成失敗: #${channelName}</span><br>`;
                return;
            }

            result.innerHTML += `<span class="log-info">メッセージ復元 → #${channelName} (${messages.length}件)</span><br>`;

            for (const msg of messages) {
                try {
                    const payload = {
                        content: msg.content || "",
                        username: msg.author.global_name || msg.author.username,
                        avatar_url: msg.author.avatar ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png` : null,
                        embeds: msg.embeds || [],
                        allowed_mentions: { parse: [] }
                    };

                    await fetch(`https://discord.com/api/webhooks/${webhook.id}/${webhook.token}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const short = msg.content ? msg.content.substring(0, 50) + (msg.content.length > 50 ? "..." : "") : "(埋め込み)";
                    result.innerHTML += `<span class="log-success">✓ ${msg.author.username}: ${short}</span><br>`;

                } catch (e) {
                    // エラーが出てもスキップして継続
                    result.innerHTML += `<span class="log-error">✗ 送信スキップ</span><br>`;
                }
                await safeDelay(1300); // メッセージ送信間隔
            }

            try {
                await fetch(`${API}/webhooks/${webhook.id}`, { method: 'DELETE', headers: { 'Authorization': token } });
            } catch {}
        }

        // メイン実行
        document.getElementById('execute-btn').onclick = async () => {
            const sourceId = document.getElementById('source-id').value.trim();
            const targetId = document.getElementById('target-id').value.trim();
            const doReset = document.getElementById('reset-mode').checked;
            const maxMsg = parseInt(document.getElementById('max-messages').value) || 200;

            if (!sourceId || !targetId) return alert('元サーバーIDと対象サーバーIDを入力してください');
            if (sourceChannels.length === 0) return alert('先に「チャンネル情報を取得」ボタンを押してください');

            if (!confirm(`完全クローンを実行しますか？\n対象: ${targetId}\nリセット: ${doReset ? 'ON' : 'OFF'}`)) return;

            const result = document.getElementById('result');
            result.classList.remove('hidden');
            result.innerHTML = '<strong>【完全クローン開始】</strong><br><br>';

            // リセット
            if (doReset) {
                result.innerHTML += '<strong>既存チャンネルを削除中...</strong><br>';
                try {
                    const existing = await (await fetch(`${API}/guilds/${targetId}/channels`, { headers: { 'Authorization': token } })).json();
                    for (const ch of existing) {
                        try {
                            await fetch(`${API}/channels/${ch.id}`, { method: 'DELETE', headers: { 'Authorization': token } });
                            result.innerHTML += `<span class="log-success">✓ 削除: ${ch.name}</span><br>`;
                        } catch (e) {
                            result.innerHTML += `<span class="log-error">✗ 削除失敗: ${ch.name}</span><br>`;
                        }
                        await safeDelay(700);
                    }
                } catch (e) {
                    result.innerHTML += '<span class="log-error">リセット中にエラー</span><br>';
                }
            }

            // カテゴリ作成
            result.innerHTML += '<strong>カテゴリを作成中...</strong><br>';
            const categoryMap = {};
            const categories = sourceChannels.filter(ch => ch.type === 4).sort((a, b) => a.position - b.position);

            for (const cat of categories) {
                try {
                    const payload = { name: cat.name, type: 4, position: cat.position };
                    const res = await fetch(`${API}/guilds/${targetId}/channels`, {
                        method: 'POST',
                        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const newCat = await res.json();
                        categoryMap[cat.id] = newCat.id;
                        result.innerHTML += `<span class="log-success">✓ カテゴリ: ${cat.name}</span><br>`;
                    } else {
                        result.innerHTML += `<span class="log-error">✗ カテゴリ失敗: ${cat.name}</span><br>`;
                    }
                } catch (e) {
                    result.innerHTML += `<span class="log-error">例外: ${cat.name}</span><br>`;
                }
                await safeDelay(600);
            }

            // チャンネル作成 + メッセージ復元
            result.innerHTML += '<br><strong>チャンネル作成＆メッセージ復元中...</strong><br>';
            const normalChannels = sourceChannels.filter(ch => ch.type !== 4).sort((a, b) => a.position - b.position);

            for (const ch of normalChannels) {
                let newChannelId = null;

                try {
                    const payload = {
                        name: ch.name,
                        type: ch.type,
                        position: ch.position,
                        parent_id: ch.parent_id ? categoryMap[ch.parent_id] || null : null,
                        permission_overwrites: ch.permission_overwrites || []
                    };
                    if (ch.type === 2) {
                        payload.bitrate = ch.bitrate || 64000;
                        payload.user_limit = ch.user_limit || 0;
                    }

                    const res = await fetch(`${API}/guilds/${targetId}/channels`, {
                        method: 'POST',
                        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const newCh = await res.json();
                        newChannelId = newCh.id;
                        result.innerHTML += `<span class="log-success">✓ 作成: ${ch.name}</span><br>`;
                    } else {
                        result.innerHTML += `<span class="log-error">✗ 作成失敗: ${ch.name}</span><br>`;
                        await safeDelay(800);
                        continue;
                    }
                } catch (e) {
                    result.innerHTML += `<span class="log-error">作成例外: ${ch.name}</span><br>`;
                    await safeDelay(1500);
                    continue;
                }

                // テキストチャンネルの場合にメッセージ復元
                if (newChannelId && ch.type === 0) {
                    try {
                        let messages = await getAllMessages(ch.id, 100);
                        messages = messages.slice(-maxMsg);
                        if (messages.length > 0) {
                            await sendMessages(newChannelId, messages, result, ch.name);
                        }
                    } catch (e) {
                        result.innerHTML += `<span class="log-error">メッセージ処理でエラー: ${ch.name}</span><br>`;
                    }
                }

                await safeDelay(800); // 次のチャンネルへ進む前の待機
            }

            result.innerHTML += '<br><strong style="color:#3ba55d">すべての処理が完了しました！</strong>';
        };

        // 情報取得
        document.getElementById('load-btn').onclick = async () => {
            const sourceId = document.getElementById('source-id').value.trim();
            if (!sourceId) return alert('元サーバーIDを入力してください');

            try {
                sourceChannels = await (await fetch(`${API}/guilds/${sourceId}/channels`, { headers: { 'Authorization': token } })).json();
                const preview = document.getElementById('preview');
                preview.classList.remove('hidden');
                preview.innerHTML = `<strong>取得完了</strong><br>総チャンネル数: ${sourceChannels.length}個`;
                alert('チャンネル情報取得完了');
            } catch (e) {
                alert('取得失敗: サーバーIDまたは権限を確認してください');
            }
        };

        document.getElementById('connect-btn').onclick = async () => {
            token = document.getElementById('token-input').value.trim();
            if (!token) return alert('トークンを入力してください');

            try {
                const me = await (await fetch(`${API}/users/@me`, { headers: { 'Authorization': token } })).json();
                document.getElementById('username').textContent = me.global_name || me.username;
                document.getElementById('avatar').src = me.avatar 
                    ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=128` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';

                document.getElementById('token-card').classList.add('hidden');
                document.getElementById('main-card').classList.remove('hidden');
                document.getElementById('user-card').classList.remove('hidden');
            } catch (e) {
                alert('接続失敗: トークンが無効です');
            }
        };

        document.getElementById('logout-btn').onclick = () => {
            if (confirm('ログアウトしますか？')) location.reload();
        };
    </script>
</body>
</html>
