<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord プライベートチャンネルのみクローン - v7 (エラー耐性強化)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background:#202225; color:#dcddde; font-family:'Whitney',sans-serif; padding:20px; margin:0; }
        .container { max-width:1000px; margin:0 auto; }
        header { text-align:center; padding:25px; border-bottom:1px solid #36393f; }
        h1 { color:white; margin:0; }
        .card { background:#2f3136; border-radius:8px; padding:20px; margin:20px 0; }
        .section { background:#36393f; border-radius:8px; padding:18px; margin-bottom:20px; }
        .section-title { font-size:1.25em; font-weight:bold; margin-bottom:12px; color:#5865F2; }
        input { width:100%; padding:12px; background:#202225; border:none; color:white; border-radius:4px; margin-bottom:10px; }
        button { padding:14px 20px; background:#5865F2; color:white; border:none; cursor:pointer; border-radius:4px; width:100%; font-size:1.1em; margin-top:10px; }
        button:hover { background:#4752C4; }
        button.danger { background:#ed4245; }
        .result { padding:18px; border-radius:8px; margin-top:20px; max-height:900px; overflow-y:auto; background:#1e1f22; white-space:pre-line; font-size:0.9em; line-height:1.55; }
        .hidden { display:none; }
        .warning { color:#faa81a; font-size:0.95em; margin:12px 0; line-height:1.6; }
        .log-success { color:#3ba55d; }
        .log-error { color:#ed4245; }
        .log-info { color:#faa81a; }
        .preview { background:#1e1f22; padding:15px; border-radius:8px; margin-top:10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-discord"></i> プライベートチャンネルのみクローン - v7</h1>
            <p>作成失敗を減らす強化版 • MANAGE_ROLESがなくてもできる限り対応</p>
        </header>

        <div id="token-card" class="card">
            <h2>トークンを入力</h2>
            <input type="password" id="token-input" placeholder="ユーザー・トークン">
            <button id="connect-btn">接続</button>
        </div>

        <div id="main-card" class="card hidden">
            <h2>設定</h2>

            <div class="section">
                <div class="section-title">コピー元サーバーID</div>
                <input type="text" id="source-id" placeholder="元のサーバーID">
                <button id="load-btn">チャンネル情報を取得</button>
                <div id="preview" class="preview hidden"></div>
            </div>

            <div class="section">
                <div class="section-title">対象サーバーID</div>
                <input type="text" id="target-id" placeholder="複製先のサーバーID">
            </div>

            <div class="section">
                <div class="toggle-label">
                    <span>実行前に対象サーバーの全チャンネルをリセット</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="reset-mode" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="warning">⚠️ リセットONにすると対象サーバーの全チャンネルが削除されます</div>
            </div>

            <div class="section">
                <div class="toggle-label">
                    <span>1チャンネルあたりの復元メッセージ数</span>
                    <input type="number" id="max-messages" value="70" style="width:140px; margin-left:15px; background:#202225; color:white; padding:8px; border-radius:4px;">
                </div>
            </div>

            <div class="section">
                <button id="execute-btn" class="danger">プライベートチャンネルのみ複製実行（v7）</button>
            </div>

            <div id="result" class="result hidden"></div>
        </div>

        <div id="user-card" class="card hidden">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <img id="avatar" src="" width="64" height="64" style="border-radius:50%;">
                <h3 id="username">接続済みユーザー</h3>
                <button id="logout-btn" class="danger">ログアウト</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://discord.com/api/v9';
        let token = null;
        let sourceChannels = [];
        let myUserId = null;

        const delay = ms => new Promise(r => setTimeout(r, ms));

        async function safeDelay(ms) {
            await delay(ms);
        }

        async function fetchWithRetry(url, options, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.status === 429) {
                        const retryAfter = parseInt(res.headers.get('Retry-After') || '10') * 1000;
                        await safeDelay(retryAfter + i * 4000);
                        continue;
                    }
                    return res;
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await safeDelay(5000 * (i + 1));
                }
            }
        }

        async function getAllMessages(channelId) {
            let messages = [];
            let lastId = null;
            for (let i = 0; i < 8; i++) {
                try {
                    let url = `${API}/channels/${channelId}/messages?limit=70`;
                    if (lastId) url += `&before=${lastId}`;
                    const res = await fetchWithRetry(url, { headers: { 'Authorization': token } });
                    if (!res.ok) break;
                    const batch = await res.json();
                    if (batch.length === 0) break;
                    messages.unshift(...batch);
                    lastId = batch[0].id;
                    if (batch.length < 70) break;
                    await safeDelay(1400);
                } catch (e) {
                    await safeDelay(4000);
                    break;
                }
            }
            return messages;
        }

        async function sendMessages(targetChannelId, messages, result, channelName) {
            if (messages.length === 0) return;
            // Webhookを使ったメッセージ復元（省略せず同じ処理）
            let webhook = null;
            try {
                const whRes = await fetchWithRetry(`${API}/channels/${targetChannelId}/webhooks`, {
                    method: 'POST',
                    headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: "Private Clone" })
                });
                if (whRes.ok) webhook = await whRes.json();
            } catch (e) {
                result.innerHTML += `<span class="log-error">Webhook作成失敗: #${channelName}</span><br>`;
                return;
            }

            result.innerHTML += `<span class="log-info">🔒 メッセージ復元 → #${channelName} (${messages.length}件)</span><br>`;

            for (const msg of messages) {
                try {
                    const payload = {
                        content: msg.content || "",
                        username: msg.author.global_name || msg.author.username || "Unknown",
                        avatar_url: msg.author.avatar ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png` : null,
                        embeds: msg.embeds || [],
                        allowed_mentions: { parse: [] }
                    };

                    await fetch(`https://discord.com/api/webhooks/${webhook.id}/${webhook.token}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const short = msg.content ? msg.content.substring(0, 50) + "..." : "(埋め込み)";
                    result.innerHTML += `<span class="log-success">✓ ${msg.author.username}: ${short}</span><br>`;
                } catch (e) {
                    result.innerHTML += `<span class="log-error">✗ 送信スキップ</span><br>`;
                }
                await safeDelay(1500);
            }

            if (webhook) {
                try { await fetchWithRetry(`${API}/webhooks/${webhook.id}`, { method: 'DELETE', headers: { 'Authorization': token } }); } catch {}
            }
        }

        function isPrivateChannel(ch) {
            if (!ch.permission_overwrites || ch.permission_overwrites.length === 0) return false;
            const everyone = ch.permission_overwrites.find(p => p.id === ch.guild_id);
            if (!everyone) return false;
            return (BigInt(everyone.deny || 0) & 1024n) !== 0n;
        }

        document.getElementById('execute-btn').onclick = async () => {
            const sourceId = document.getElementById('source-id').value.trim();
            const targetId = document.getElementById('target-id').value.trim();
            const doReset = document.getElementById('reset-mode').checked;
            const maxMsg = parseInt(document.getElementById('max-messages').value) || 70;

            if (!sourceId || !targetId) return alert('サーバーIDを入力してください');
            if (sourceChannels.length === 0) return alert('先にチャンネル情報を取得してください');
            if (!myUserId) return alert('自分のユーザーIDが取得できていません。もう一度接続してください。');

            if (!confirm('プライベートチャンネルのみ複製します。\n権限エラーが出やすいチャンネルはスキップされます。実行しますか？')) return;

            const result = document.getElementById('result');
            result.classList.remove('hidden');
            result.innerHTML = '<strong>【プライベートチャンネル複製開始 - v7 エラー耐性強化】</strong><br><br>';

            if (doReset) {
                result.innerHTML += '<strong>既存チャンネル削除中...</strong><br>';
                try {
                    const existing = await (await fetchWithRetry(`${API}/guilds/${targetId}/channels`, { headers: { 'Authorization': token } })).json();
                    for (const ch of existing) {
                        try {
                            await fetchWithRetry(`${API}/channels/${ch.id}`, { method: 'DELETE', headers: { 'Authorization': token } });
                            result.innerHTML += `<span class="log-success">✓ 削除: ${ch.name}</span><br>`;
                        } catch (e) {}
                        await safeDelay(1000);
                    }
                } catch (e) {}
            }

            // カテゴリ作成
            result.innerHTML += '<br><strong>カテゴリ作成中...</strong><br>';
            const categoryMap = {};
            const categories = sourceChannels.filter(ch => ch.type === 4).sort((a,b)=>a.position-b.position);

            for (const cat of categories) {
                try {
                    const payload = { name: cat.name, type: 4, position: cat.position };
                    const res = await fetchWithRetry(`${API}/guilds/${targetId}/channels`, {
                        method: 'POST',
                        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const newCat = await res.json();
                        categoryMap[cat.id] = newCat.id;
                        result.innerHTML += `<span class="log-success">✓ カテゴリ: ${cat.name}</span><br>`;
                    }
                } catch (e) {
                    result.innerHTML += `<span class="log-error">カテゴリ失敗: ${cat.name}</span><br>`;
                }
                await safeDelay(1100);
            }

            // プライベートチャンネル処理
            result.innerHTML += '<br><strong>🔒 シンプルプライベートチャンネル作成中...</strong><br>';
            const privateChannels = sourceChannels
                .filter(ch => ch.type !== 4 && isPrivateChannel(ch))
                .sort((a,b)=>a.position-b.position);

            for (const ch of privateChannels) {
                let newChannelId = null;

                try {
                    // まず権限なしでチャンネルを作成（失敗しにくくするため）
                    const payload = {
                        name: ch.name,
                        type: ch.type,
                        position: ch.position,
                        parent_id: ch.parent_id ? categoryMap[ch.parent_id] || null : null
                    };

                    if (ch.type === 2) {
                        payload.bitrate = ch.bitrate || 64000;
                        payload.user_limit = ch.user_limit || 0;
                    }

                    let res = await fetchWithRetry(`${API}/guilds/${targetId}/channels`, {
                        method: 'POST',
                        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const newCh = await res.json();
                        newChannelId = newCh.id;
                        result.innerHTML += `<span class="log-success">✓ 作成: ${ch.name}</span><br>`;

                        // 作成後にシンプルなプライベート権限を適用
                        try {
                            // @everyone を非公開に
                            await fetchWithRetry(`${API}/channels/${newChannelId}/permissions/${targetId}`, {
                                method: 'PUT',
                                headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ type: 0, deny: "1024" })
                            });

                            // 自分だけ見えるように
                            await fetchWithRetry(`${API}/channels/${newChannelId}/permissions/${myUserId}`, {
                                method: 'PUT',
                                headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ type: 1, allow: ch.type === 0 ? "3072" : "1024" }) // View + Send (テキストの場合)
                            });

                            result.innerHTML += `<span class="log-success">   └ プライベート化完了（あなただけが見えます）</span><br>`;
                        } catch (permErr) {
                            result.innerHTML += `<span class="log-error">   └ プライベート化失敗（権限不足？）</span><br>`;
                        }
                    } else {
                        result.innerHTML += `<span class="log-error">✗ 作成失敗: ${ch.name}</span><br>`;
                        await safeDelay(1500);
                        continue;
                    }
                } catch (e) {
                    result.innerHTML += `<span class="log-error">作成例外: ${ch.name}</span><br>`;
                    await safeDelay(2000);
                    continue;
                }

                // メッセージ復元
                if (newChannelId && ch.type === 0) {
                    try {
                        let messages = await getAllMessages(ch.id);
                        messages = messages.slice(-maxMsg);
                        if (messages.length > 0) {
                            await sendMessages(newChannelId, messages, result, ch.name);
                        }
                    } catch (e) {
                        result.innerHTML += `<span class="log-error">メッセージ復元エラー: ${ch.name}</span><br>`;
                    }
                }

                await safeDelay(1400);
            }

            result.innerHTML += '<br><strong style="color:#3ba55d">処理完了しました！（失敗したチャンネルは権限不足の可能性が高いです）</strong>';
        };

        // load-btn, connect-btn, logout-btn は前回と同じ（省略せずそのまま動作）
        document.getElementById('load-btn').onclick = async () => {
            const sourceId = document.getElementById('source-id').value.trim();
            if (!sourceId) return alert('元サーバーIDを入力してください');

            try {
                const res = await fetchWithRetry(`${API}/guilds/${sourceId}/channels`, { headers: { 'Authorization': token } });
                sourceChannels = await res.json();

                const privateCount = sourceChannels.filter(ch => ch.type !== 4 && isPrivateChannel(ch)).length;

                const preview = document.getElementById('preview');
                preview.classList.remove('hidden');
                preview.innerHTML = `<strong>取得完了</strong><br>総チャンネル: ${sourceChannels.length}個<br>プライベートチャンネル: ${privateCount}個`;
                alert(`取得完了\nプライベートチャンネル: ${privateCount}個検出`);
            } catch (e) {
                alert('取得失敗: 権限またはトークンを確認してください');
            }
        };

        document.getElementById('connect-btn').onclick = async () => {
            token = document.getElementById('token-input').value.trim();
            if (!token) return alert('トークンを入力してください');

            try {
                const res = await fetchWithRetry(`${API}/users/@me`, { headers: { 'Authorization': token } });
                const me = await res.json();
                myUserId = me.id;

                document.getElementById('username').textContent = me.global_name || me.username;
                document.getElementById('avatar').src = me.avatar 
                    ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=128` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';

                document.getElementById('token-card').classList.add('hidden');
                document.getElementById('main-card').classList.remove('hidden');
                document.getElementById('user-card').classList.remove('hidden');
            } catch (e) {
                alert('接続失敗: トークンが無効です');
            }
        };

        document.getElementById('logout-btn').onclick = () => {
            if (confirm('ログアウトしますか？')) location.reload();
        };
    </script>
</body>
</html>
