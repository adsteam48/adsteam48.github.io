<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord メッセージのみ復元ツール - 名前緩和版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background:#202225; color:#dcddde; font-family:'Whitney',sans-serif; padding:20px; margin:0; }
        .container { max-width:950px; margin:0 auto; }
        header { text-align:center; padding:20px; border-bottom:1px solid #36393f; }
        h1, h2 { color:white; }
        .card { background:#2f3136; border-radius:8px; padding:20px; margin:20px 0; }
        .section { background:#36393f; border-radius:8px; padding:15px; margin-bottom:20px; }
        .section-title { font-size:1.2em; font-weight:bold; margin-bottom:10px; color:#5865F2; }
        input, select { width:100%; padding:12px; background:#202225; border:none; color:white; border-radius:4px; margin-bottom:10px; }
        button { padding:12px 20px; background:#5865F2; color:white; border:none; cursor:pointer; border-radius:4px; width:100%; font-size:1.1em; margin-top:10px; }
        button:hover { background:#4752C4; }
        button.danger { background:#ed4245; }
        .result { padding:15px; border-radius:8px; margin-top:20px; max-height:700px; overflow-y:auto; background:#1e1f22; white-space:pre-line; font-size:0.9em; line-height:1.5; }
        .hidden { display:none; }
        .warning { color:#faa81a; font-size:0.95em; margin:10px 0; line-height:1.5; }
        .log-success { color:#3ba55d; }
        .log-error { color:#ed4245; }
        .log-info { color:#faa81a; }
        .preview { background:#1e1f22; padding:15px; border-radius:8px; margin-top:10px; font-size:0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-discord"></i> Discord メッセージのみ復元ツール（名前緩和版）</h1>
            <p>絵文字付きチャンネルにも対応 • 自己責任で使用</p>
        </header>

        <div id="token-card" class="card">
            <h2>トークンを入力</h2>
            <input type="password" id="token-input" placeholder="ユーザー・トークン">
            <button id="connect-btn">接続</button>
        </div>

        <div id="main-card" class="card hidden">
            <h2>メッセージ復元設定</h2>

            <div class="section">
                <div class="section-title">コピー元サーバーID</div>
                <input type="text" id="source-id" placeholder="元サーバーID">
                <button id="load-btn">チャンネル一覧を取得</button>
                <div id="preview" class="preview hidden"></div>
            </div>

            <div class="section">
                <div class="section-title">対象サーバー</div>
                <select id="target-select"></select>
            </div>

            <div class="section">
                <div class="toggle-label">
                    <span>1チャンネルあたりの最大復元メッセージ数</span>
                    <input type="number" id="max-messages" value="300" style="width:130px; margin-left:15px; background:#202225; color:white; padding:8px; border-radius:4px;">
                </div>
                <div class="warning">
                    ⚠️ 注意<br>
                    ・復元は時間がかかります<br>
                    ・絵文字を除去して名前を比較します（よりマッチしやすくなりました）
                </div>
            </div>

            <div class="section">
                <button id="execute-btn">メッセージ復元開始</button>
            </div>

            <div id="result" class="result hidden"></div>
        </div>

        <div id="user-card" class="card hidden">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <img id="avatar" src="" width="64" height="64" style="border-radius:50%;">
                <h3 id="username">接続済み</h3>
                <button id="logout-btn" class="danger">ログアウト</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://discord.com/api/v9';
        let token = null;
        let myGuilds = [];
        let sourceChannels = [];

        const delay = ms => new Promise(r => setTimeout(r, ms));

        // 絵文字や特殊文字を除去してクリーンな名前を返す
        function cleanChannelName(name) {
            return name.replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]|[\u{1F300}-\u{1F5FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|┃|🧰|📗|📚|❓|🗣️|📢|🔞|📞|ℹ️|✅|🔔|⬇|🦙|🤝|🎫|🏆|🎥|🤖|🎉|🎁|🔄|👋|🌎|📊|😤|💀|🎮|🎧|⚔️|🔒|👑|🌀|🕶|🕳|🌐|🔑|⚙|❔|✔|🚫|⭕|❌|⬆️|🐈|🥇|🔫|📷|⌨️|🌍| /gu, '')
                       .trim()
                       .toLowerCase()
                       .replace(/[^a-z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/g, '');
        }

        // 以前の関数（getAllMessages, restoreChannelMessages）は変更なしで省略（前のコードからコピーして貼り付けてください）
        // ※ ここに前のバージョンの getAllMessages と restoreChannelMessages をそのまま入れてください

        async function getAllMessages(channelId, limit = 100) {
            let messages = [];
            let lastId = null;
            while (true) {
                let url = `${API}/channels/${channelId}/messages?limit=${limit}`;
                if (lastId) url += `&before=${lastId}`;
                try {
                    const res = await fetch(url, { headers: { 'Authorization': token } });
                    if (!res.ok) break;
                    const batch = await res.json();
                    if (batch.length === 0) break;
                    messages.unshift(...batch);
                    lastId = batch[0].id;
                    if (batch.length < limit) break;
                    await delay(600);
                } catch { break; }
            }
            return messages;
        }

        async function restoreChannelMessages(targetChannelId, messages, result, channelName) {
            if (messages.length === 0) {
                result.innerHTML += `<span class="log-info">メッセージなし: #${channelName}</span><br>`;
                return;
            }

            let webhook = null;
            try {
                const whRes = await fetch(`${API}/channels/${targetChannelId}/webhooks`, {
                    method: 'POST',
                    headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: "Restore" })
                });
                if (whRes.ok) webhook = await whRes.json();
            } catch {}

            if (!webhook) {
                result.innerHTML += `<span class="log-error">Webhook失敗: #${channelName}</span><br>`;
                return;
            }

            result.innerHTML += `<span class="log-info">復元開始 → #${channelName} (${messages.length}件)</span><br>`;

            for (const msg of messages) {
                if (!msg.content && (!msg.embeds || msg.embeds.length === 0)) continue;
                try {
                    const payload = {
                        content: msg.content || "",
                        username: msg.author.global_name || msg.author.username,
                        avatar_url: msg.author.avatar ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png` : null,
                        embeds: msg.embeds || [],
                        allowed_mentions: { parse: [] }
                    };
                    await fetch(`https://discord.com/api/webhooks/${webhook.id}/${webhook.token}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const short = msg.content ? msg.content.substring(0, 50) + (msg.content.length > 50 ? "..." : "") : "(埋め込み)";
                    result.innerHTML += `<span class="log-success">✓ ${msg.author.username}: ${short}</span><br>`;
                } catch {
                    result.innerHTML += `<span class="log-error">✗ 失敗</span><br>`;
                }
                await delay(1350);
            }

            try { await fetch(`${API}/webhooks/${webhook.id}`, { method: 'DELETE', headers: { 'Authorization': token } }); } catch {}
        }

        // 接続・ロード・実行部分（変更あり）
        document.getElementById('connect-btn').onclick = async () => {
            token = document.getElementById('token-input').value.trim();
            if (!token) return alert('トークンを入力してください');
            localStorage.setItem('discord_token', token);

            try {
                const me = await (await fetch(`${API}/users/@me`, { headers: { 'Authorization': token } })).json();
                document.getElementById('username').textContent = me.global_name || me.username;
                document.getElementById('avatar').src = me.avatar 
                    ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=128` 
                    : 'https://cdn.discordapp.com/embed/avatars/0.png';

                myGuilds = await (await fetch(`${API}/users/@me/guilds`, { headers: { 'Authorization': token } })).json();

                const select = document.getElementById('target-select');
                select.innerHTML = '';
                myGuilds.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.name;
                    select.appendChild(opt);
                });

                document.getElementById('token-card').classList.add('hidden');
                document.getElementById('main-card').classList.remove('hidden');
                document.getElementById('user-card').classList.remove('hidden');
            } catch (e) {
                alert('接続失敗: ' + (e.message || 'トークン無効'));
            }
        };

        document.getElementById('load-btn').onclick = async () => {
            const sourceId = document.getElementById('source-id').value.trim();
            if (!sourceId) return alert('元サーバーIDを入力してください');

            try {
                const channels = await (await fetch(`${API}/guilds/${sourceId}/channels`, { headers: { 'Authorization': token } })).json();
                sourceChannels = channels.filter(ch => ch.type === 0);

                const preview = document.getElementById('preview');
                preview.classList.remove('hidden');
                preview.innerHTML = `<strong>取得完了</strong><br>テキストチャンネル: ${sourceChannels.length}個`;
                alert(`テキストチャンネル ${sourceChannels.length}個 を取得しました`);
            } catch (e) {
                alert('取得失敗: IDまたは権限を確認してください');
            }
        };

        document.getElementById('execute-btn').onclick = async () => {
            const targetId = document.getElementById('target-select').value;
            const maxMsg = parseInt(document.getElementById('max-messages').value) || 300;

            if (!targetId) return alert('対象サーバーを選択してください');
            if (sourceChannels.length === 0) return alert('先にチャンネル一覧を取得してください');

            if (!confirm(`復元を開始しますか？\n最大 ${maxMsg}件/チャンネル`)) return;

            const result = document.getElementById('result');
            result.classList.remove('hidden');
            result.innerHTML = '<strong>【メッセージ復元開始】</strong><br><br>';

            let targetChannels = [];
            try {
                targetChannels = await (await fetch(`${API}/guilds/${targetId}/channels`, { headers: { 'Authorization': token } })).json();
            } catch (e) {
                result.innerHTML += '<span class="log-error">対象サーバーのチャンネル取得失敗</span><br>';
                return;
            }

            for (const srcCh of sourceChannels) {
                const srcClean = cleanChannelName(srcCh.name);

                // 対象チャンネルから最も近い名前を探す
                let bestMatch = null;
                let bestScore = 0;

                for (const tc of targetChannels) {
                    if (tc.type !== 0) continue;
                    const tcClean = cleanChannelName(tc.name);
                    if (tcClean === srcClean) {
                        bestMatch = tc;
                        break; // 完全一致なら即決定
                    }
                    // 部分一致スコア（簡易）
                    if (tcClean.includes(srcClean) || srcClean.includes(tcClean)) {
                        if (tcClean.length > bestScore) {
                            bestScore = tcClean.length;
                            bestMatch = tc;
                        }
                    }
                }

                if (!bestMatch) {
                    result.innerHTML += `<span class="log-error">マッチなし: #${srcCh.name} (クリーン名: ${srcClean})</span><br>`;
                    continue;
                }

                result.innerHTML += `<span class="log-info">処理中 → #${srcCh.name} → #${bestMatch.name}</span><br>`;

                try {
                    let messages = await getAllMessages(srcCh.id, 100);
                    messages = messages.slice(-maxMsg);

                    await restoreChannelMessages(bestMatch.id, messages, result, srcCh.name);
                } catch (e) {
                    result.innerHTML += `<span class="log-error">エラー: #${srcCh.name}</span><br>`;
                }

                await delay(1000);
            }

            result.innerHTML += '<br><strong style="color:#3ba55d">復元処理完了！</strong>';
        };

        document.getElementById('logout-btn').onclick = () => {
            if (confirm('ログアウトしますか？')) {
                localStorage.clear();
                location.reload();
            }
        };

        const savedToken = localStorage.getItem('discord_token');
        if (savedToken) {
            document.getElementById('token-input').value = savedToken;
            document.getElementById('connect-btn').click();
        }
    </script>
</body>
</html>
