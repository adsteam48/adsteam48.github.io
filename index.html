<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Mirror Selfbot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    #logContainer { font-family: monospace; line-height: 1.6; }
    .status-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-4xl font-bold mb-2">Discord Mirror Selfbot</h1>
    <p class="text-zinc-400 mb-8">トークン入力で即使用可能</p>

    <!-- トークン入力 -->
    <div id="tokenPanel" class="bg-zinc-900 rounded-3xl p-8 mb-8">
      <h2 class="text-xl font-semibold mb-4">Discord Token</h2>
      <input id="tokenInput" type="password" placeholder="mfa.XXXXXXXXXXXXXXXXXXXXXXXXXXXX" 
             class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-sm mb-4 focus:outline-none focus:border-blue-500">
      <button onclick="saveTokenAndStart()" 
              class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-medium">
        ✅ Tokenを保存してボット起動
      </button>
      <p class="text-xs text-zinc-500 mt-3">※ Tokenはブラウザに一時保存されます（ページを閉じると消えます）</p>
    </div>

    <div id="mainPanel" class="hidden">
      <div id="status" class="flex items-center gap-3 bg-zinc-900 px-6 py-3 rounded-2xl mb-8 w-fit">
        <div class="w-3 h-3 bg-red-500 rounded-full status-dot"></div>
        <span class="font-medium text-lg">停止中</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-zinc-900 rounded-3xl p-8">
          <h2 class="text-2xl font-semibold mb-6">コントロール</h2>
          <div class="flex gap-4">
            <button onclick="startBot()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl text-xl font-medium">🚀 起動</button>
            <button onclick="stopBot()" class="flex-1 bg-red-600 hover:bg-red-500 py-5 rounded-2xl text-xl font-medium">⏹ 停止</button>
          </div>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-8">
          <h2 class="text-2xl font-semibold mb-4">リアルタイムログ</h2>
          <div id="logContainer" class="h-80 overflow-y-auto p-5 rounded-2xl bg-black text-emerald-300 text-sm"></div>
        </div>
      </div>

      <div class="mt-8 bg-zinc-900 rounded-3xl p-8">
        <h2 class="text-2xl font-semibold mb-4">config.json エディタ</h2>
        <textarea id="configEditor" rows="14" class="w-full bg-zinc-950 border border-zinc-700 rounded-3xl p-6 font-mono text-sm"></textarea>
        <button onclick="saveConfig()" class="mt-6 px-10 py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-medium">💾 保存して適用</button>
      </div>
    </div>
  </div>

  <script>
    let currentToken = "";

    function addLog(msg, color = "emerald") {
      const log = document.getElementById("logContainer");
      const time = new Date().toLocaleTimeString("ja-JP");
      log.innerHTML += `<div class="text-${color}-400">[${time}] ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    function saveTokenAndStart() {
      const token = document.getElementById("tokenInput").value.trim();
      if (!token) {
        alert("Tokenを入力してください");
        return;
      }
      currentToken = token;
      localStorage.setItem("discordToken", token);

      document.getElementById("tokenPanel").classList.add("hidden");
      document.getElementById("mainPanel").classList.remove("hidden");

      addLog("✅ Tokenを保存しました", "blue");
      addLog("サーバー起動準備完了。起動ボタンを押してください", "zinc");
    }

    async function startBot() {
      if (!currentToken) {
        addLog("Tokenが設定されていません", "red");
        return;
      }
      try {
        const res = await fetch("http://localhost:3000/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: currentToken })
        });
        const data = await res.json();
        addLog(data.success ? "🚀 Selfbotを起動しました" : "起動失敗", data.success ? "emerald" : "red");
      } catch (e) {
        addLog("サーバーに接続できません。server.jsを起動していますか？", "red");
      }
    }

    async function stopBot() {
      try {
        await fetch("http://localhost:3000/api/stop", { method: "POST" });
        addLog("🛑 Selfbotを停止しました", "amber");
      } catch (e) {
        addLog("サーバー接続エラー", "red");
      }
    }

    async function saveConfig() {
      try {
        const config = JSON.parse(document.getElementById("configEditor").value);
        await fetch("http://localhost:3000/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config)
        });
        addLog("💾 config.json を保存しました", "blue");
      } catch (e) {
        addLog("JSONエラー: " + e.message, "red");
      }
    }

    // ページロード時
    window.onload = () => {
      const savedToken = localStorage.getItem("discordToken");
      if (savedToken) {
        currentToken = savedToken;
        document.getElementById("tokenPanel").classList.add("hidden");
        document.getElementById("mainPanel").classList.remove("hidden");
        addLog("以前のTokenを読み込みました", "blue");
      } else {
        addLog("Tokenを入力して開始してください", "zinc");
      }
    };
  </script>
</body>
</html>
